name: Check Job and Step Results
description: Logs a message and exits based on the result of one or more workflow jobs and/or steps

on:
  workflow_call:
    inputs:
      results:
        type: string
        description: Array of results of jobs and/or steps to check
        default: '[]'
        required: true

jobs:
  check:
    name: Check Results
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        result: ${{ fromJson(inputs.results) }}
    steps:
      - uses: Jaronline/.github/actions/check-job-or-step-result@main
        with:
          result: ${{ matrix.result }}
